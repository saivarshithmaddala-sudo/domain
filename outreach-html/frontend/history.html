<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign History - outreachos.in.net</title>
  <meta name="description" content="Review historical campaign run results, success rates, total targets processed, and email dispatches executed by outreachos.in.net.">
  <meta name="keywords" content="campaign history, outreach performance, email dispatch statistics, sales automation reporting">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Campaign History - outreachos.in.net">
  <meta property="og:description" content="Log of completed B2B lookalike campaign runs, verified emails, and Brevo delivery metrics.">
  <meta property="og:image" content="logo.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="demo.css">
  <link rel="icon" type="image/png" href="logo.png">
  <script src="preloader.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="preloader-content">
      <div class="preloader-logo-wrapper">
        <img src="logo.png" alt="outreachos Logo" class="preloader-logo">
        <div class="preloader-ring"></div>
      </div>
      <h2 class="preloader-title">outreachos<span class="text-cyan">.in.net</span></h2>
      <div class="preloader-progress-bar">
        <div class="preloader-progress-fill"></div>
      </div>
      <div class="preloader-status">Initializing pipeline engine...</div>
    </div>
  </div>

  <nav class="navbar" style="backdrop-filter: blur(12px); background: rgba(10, 14, 23, 0.8);">
    <a href="index.html" class="nav-brand" style="display:flex; align-items:center; gap:0.5rem;">
      <img src="logo.png" alt="Logo" style="height:24px; width:24px; border-radius:50%; object-fit:contain; box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);">
      outreachos<span class="text-cyan">.in.net</span>
    </a>
    <div class="nav-links">
      <a href="how-it-works.html" class="nav-link">Architecture</a>
      <a href="demo.html" class="nav-link">Pipeline Tracking</a>
      <a href="history.html" class="nav-link active">History</a>
      <a href="demo.html" style="text-decoration:none;">
        <button class="btn-primary">
          <i data-lucide="play" width="16" height="16"></i> Run Pipeline
        </button>
      </a>
    </div>
  </nav>

  <!-- Glowing Background Orbs -->
  <div class="glow-orb primary" style="position: fixed; top: -100px; left: -100px; z-index: -1;"></div>
  <div class="glow-orb info" style="position: fixed; bottom: -100px; right: -100px; z-index: -1;"></div>

  <main class="container">
    <div class="page-header">
      <div>
        <div class="target-title">Campaign History</div>
      </div>
    </div>

    <div class="panel">
      <div class="table-container" style="margin-bottom: 0;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Session ID</th>
              <th>Date</th>
              <th>Target Domain</th>
              <th>Status</th>
              <th>Contacts Found</th>
              <th>Emails Sent</th>
              <th>Delivery Rate</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="7" style="text-align:center;color:#6B7280;padding:2rem;">Loading history...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="history.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
